name: Automation demo CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Run offline Python regression tests
        run: python -m unittest discover -s automation-demo/tests -v

      - name: Compile Python source and tests
        run: python -m py_compile automation-demo/monitor.py automation-demo/status_contract.py automation-demo/collect_status.py automation-demo/tests/test_monitor.py automation-demo/tests/test_status_contract.py automation-demo/tests/test_collect_status.py

      - name: Check Node.js syntax
        run: |
          node --check automation-demo/server.js
          node --check automation-demo/ecosystem.config.js
